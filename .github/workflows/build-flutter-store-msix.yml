name: Build FarooqDrive Microsoft Store MSIX

on:
  workflow_dispatch:
  push:
    branches: [main, fix/store-startup-clean-uninstall-21-2]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/build-flutter-store-msix.yml'

permissions:
  contents: read

jobs:
  build-store-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Create Windows runner
        working-directory: apps/flutter
        shell: pwsh
        run: |
          flutter create --platforms=windows .
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }
      - name: Restore official app icon
        working-directory: apps/flutter
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('assets/FarooqDrive.png', [Convert]::FromBase64String((Get-Content 'assets/FarooqDrive.png.base64' -Raw)))
          magick assets/FarooqDrive.png -define icon:auto-resize=256,128,64,48,32,24,16 windows/runner/resources/app_icon.ico
      - name: Install packages
        working-directory: apps/flutter
        run: flutter pub get
      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze
      - name: Test
        working-directory: apps/flutter
        run: flutter test
      - name: Build Windows release
        working-directory: apps/flutter
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.FAROOQDRIVE_DESKTOP_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.FAROOQDRIVE_MICROSOFT_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_ID)) { Write-Host 'Google uses the approved user-configured Desktop Client ID and Secret in Settings.' }
          if ([string]::IsNullOrWhiteSpace($env:MICROSOFT_CLIENT_ID)) { throw 'Missing Microsoft desktop client configuration.' }
          flutter build windows --release "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_CLIENT_ID" "--dart-define=MICROSOFT_DESKTOP_CLIENT_ID=$env:MICROSOFT_CLIENT_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed.' }
          (-not [string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_ID)).ToString() | Set-Content build/google-build-config-present.txt
          (Get-FileHash build/windows/x64/runner/Release/data/app.so -Algorithm SHA256).Hash | Set-Content build/app-before-msix.sha256
      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build desktop installer with uninstall cleanup
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=21.2.0" "apps/flutter/installer/FarooqDrive.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop installer build failed.' }
          New-Item -ItemType Directory -Force release-output | Out-Null
          Copy-Item apps/flutter/release/FarooqDrive-Setup-v21.2.0-Windows-x64.exe release-output/
      - name: Create unsigned Store MSIX
        working-directory: apps/flutter
        run: dart run msix:create --store --build-windows false --sign-msix false --install-certificate false
      - name: Validate and collect Store package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem apps/flutter/build/windows -Recurse -Filter *.msix)
          if ($packages.Count -ne 1) { throw "Expected exactly one MSIX; found $($packages.Count)." }
          $package = $packages[0]
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw 'Windows SDK MakeAppx is unavailable.' }
          & $makeappx.FullName unpack /p $package.FullName /d "$env:RUNNER_TEMP/store-unpacked" /o
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx package validation/unpack failed.' }
          [xml]$manifest = Get-Content "$env:RUNNER_TEMP/store-unpacked/AppxManifest.xml" -Raw
          $config = @{}
          $inConfig = $false
          foreach ($line in Get-Content apps/flutter/pubspec.yaml) {
            if ($line -eq 'msix_config:') { $inConfig = $true; continue }
            if ($inConfig -and $line -match '^  ([a-z_]+):\s*(.+)$') { $config[$Matches[1]] = $Matches[2].Trim() }
          }
          $identity = $manifest.Package.Identity
          if ($identity.Name -cne $config.identity_name) { throw 'Identity name mismatch.' }
          if ($identity.Publisher -cne $config.publisher) { throw 'Publisher mismatch.' }
          if ($identity.Version -cne $config.msix_version) { throw 'Version mismatch.' }
          if ($identity.ProcessorArchitecture -cne $config.architecture -or $identity.ProcessorArchitecture -ne 'x64') { throw 'Architecture mismatch.' }
          if ($manifest.Package.Properties.PublisherDisplayName -cne $config.publisher_display_name) { throw 'Publisher display name mismatch.' }
          if ($manifest.Package.Properties.DisplayName -cne $config.display_name) { throw 'Display name mismatch.' }
          if ([version]::Parse($identity.Version).Revision -ne 0) { throw 'Store version revision must be zero.' }
          $app = Get-ChildItem "$env:RUNNER_TEMP/store-unpacked" -Recurse -Filter app.so | Select-Object -First 1
          $expectedHash = (Get-Content apps/flutter/build/app-before-msix.sha256 -Raw).Trim()
          if (-not $app -or (Get-FileHash $app.FullName -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Packaged app differs from configured Windows build.' }
          if (Test-Path "$env:RUNNER_TEMP/store-unpacked/AppxSignature.p7x") { throw 'Expected unsigned Store submission package.' }
          $application = $manifest.Package.Applications.Application | Select-Object -First 1
          $exe = Join-Path "$env:RUNNER_TEMP/store-unpacked" $application.Executable
          if (-not (Test-Path $exe)) { throw 'Manifest executable does not exist.' }
          $filename = "FarooqDrive-Microsoft-Store-v$($identity.Version)-x64.msix"
          New-Item -ItemType Directory -Force release-output | Out-Null
          Copy-Item $package.FullName "release-output/$filename"
          Copy-Item "$env:RUNNER_TEMP/store-unpacked/AppxManifest.xml" release-output/AppxManifest.xml
          Copy-Item apps/flutter/pubspec.lock release-output/pubspec.lock
          $report = [ordered]@{
            sourceCommit = $env:GITHUB_SHA
            approvedBase = '3bb25984fa5953fac86672f681773bc9e97b7168'
            identity = [string]$identity.Name
            publisher = [string]$identity.Publisher
            publisherDisplayName = [string]$manifest.Package.Properties.PublisherDisplayName
            version = [string]$identity.Version
            architecture = [string]$identity.ProcessorArchitecture
            executable = [string]$application.Executable
            sha256 = (Get-FileHash "release-output/$filename" -Algorithm SHA256).Hash
            configuredBuildPayloadPreserved = $true
            unsignedForStore = $true
            googleBuildClientIdPresent = [bool]::Parse((Get-Content apps/flutter/build/google-build-config-present.txt -Raw).Trim())
            googleDesktopConfiguration = 'Existing approved Settings flow: Desktop Client ID and matching Secret'
            microsoftBuildClientIdPresent = $true
            makeAppxValidation = 'passed'
            windowsAppCertificationKit = 'not run'
            partnerCenterValidation = 'pending user upload'
          }
          $report | ConvertTo-Json | Set-Content release-output/validation.json
          $report | ConvertTo-Json
      - uses: actions/upload-artifact@v4
        with:
          name: FarooqDrive-Microsoft-Store-v21.2.0.0-x64
          path: release-output/*
          if-no-files-found: error

