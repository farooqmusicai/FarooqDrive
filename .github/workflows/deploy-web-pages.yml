name: Deploy Web Edition to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tested web source; Windows and Store source is released separately.
          ref: 7546012039066c6b782064a02bf5daa64f045dbe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Microsoft browser authentication
        working-directory: apps/flutter/web-auth
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node --test auth.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore official icon
        working-directory: apps/flutter
        run: |
          base64 --decode assets/FarooqDrive.png.base64 > assets/FarooqDrive.png
          cp assets/FarooqDrive.png web/FarooqDrive.png
      - name: Install packages
        working-directory: apps/flutter
        run: flutter pub get
      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze
      - name: Test
        working-directory: apps/flutter
        run: flutter test
      - name: Build GitHub Pages edition
        working-directory: apps/flutter
        run: flutter build web --release --base-href /FarooqDrive/ --dart-define=MICROSOFT_WEB_CLIENT_ID=${{ secrets.FAROOQDRIVE_MICROSOFT_CLIENT_ID }} --dart-define=GOOGLE_CLIENT_ID=${{ secrets.FAROOQDRIVE_WEB_CLIENT_ID }}
      - name: Record deployed source
        working-directory: apps/flutter
        run: python3 -c 'import json, subprocess; open("build/web/release.json", "w").write(json.dumps({"version":"21.1","source":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"webTransferLimitMiB":32}))'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/flutter/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
