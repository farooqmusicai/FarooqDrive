name: Build FarooqDrive 21.2 Feedback Test

on:
  push:
    branches:
      - fix/21-1-click-preview-icons
    paths:
      - '.github/workflows/build-21-2-feedback-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout corrected test branch
        uses: actions/checkout@v4
        with:
          ref: fix/21-1-click-preview-icons
          fetch-depth: 0

      - name: Apply surgical feedback patch
        shell: pwsh
        run: |
          git apply --check --recount .github/patches/21-2-stability-index-path.patch
          git apply --recount .github/patches/21-2-stability-index-path.patch

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Windows runner
        working-directory: apps/flutter
        shell: pwsh
        run: |
          flutter create --platforms=windows .
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }

      - name: Restore official app icon
        working-directory: apps/flutter
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('assets/FarooqDrive.png', [Convert]::FromBase64String((Get-Content 'assets/FarooqDrive.png.base64' -Raw)))
          magick assets/FarooqDrive.png -define icon:auto-resize=256,128,64,48,32,24,16 windows/runner/resources/app_icon.ico

      - name: Install packages
        working-directory: apps/flutter
        run: flutter pub get

      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze

      - name: Test
        working-directory: apps/flutter
        run: flutter test

      - name: Build Windows feedback test
        working-directory: apps/flutter
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.FAROOQDRIVE_MICROSOFT_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.FAROOQDRIVE_DESKTOP_CLIENT_ID }}
        run: flutter build windows --release "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_CLIENT_ID" "--dart-define=MICROSOFT_DESKTOP_CLIENT_ID=$env:MICROSOFT_CLIENT_ID"

      - name: Package portable feedback test
        shell: pwsh
        run: Compress-Archive -Path apps/flutter/build/windows/x64/runner/Release/* -DestinationPath FarooqDrive-Windows-x64-v21.2-Feedback-Test.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build one-click feedback test installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/flutter/release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=21.2.1" "apps/flutter/installer/FarooqDrive.iss"

      - name: Upload portable feedback test
        uses: actions/upload-artifact@v4
        with:
          name: FarooqDrive-Windows-x64-v21.2-Feedback-Test
          path: FarooqDrive-Windows-x64-v21.2-Feedback-Test.zip
          if-no-files-found: error

      - name: Upload one-click feedback test installer
        uses: actions/upload-artifact@v4
        with:
          name: FarooqDrive-Windows-Installer-v21.2-Feedback-Test
          path: apps/flutter/release/FarooqDrive-Setup-v21.2.1-Windows-x64.exe
          if-no-files-found: error

      - name: Commit verified feedback corrections
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/main.dart apps/flutter/lib/drive_controller.dart apps/flutter/lib/onedrive_api.dart apps/flutter/lib/explorer_widgets.dart apps/flutter/lib/file_preview.dart apps/flutter/pubspec.yaml
          git rm .github/patches/21-2-stability-index-path.patch
          git rm .github/workflows/build-21-2-feedback-test.yml
          git commit -m "Improve copy reliability previews background index and selected path"
          git push origin HEAD:fix/21-1-click-preview-icons
