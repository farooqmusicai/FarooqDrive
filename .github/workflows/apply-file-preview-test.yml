name: Apply and Build FarooqDrive 21.2 Preview Test

on:
  push:
    branches:
      - fix/file-selection-preview-icons
    paths:
      - '.github/workflows/apply-file-preview-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: fix/file-selection-preview-icons
          fetch-depth: 0

      - name: Verify and apply source patch
        shell: pwsh
        run: |
          git apply --check --recount .github/patches/file-selection-preview-icons.patch
          git apply --recount .github/patches/file-selection-preview-icons.patch

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Windows runner
        working-directory: apps/flutter
        shell: pwsh
        run: |
          flutter create --platforms=windows .
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }

      - name: Restore official app icon
        working-directory: apps/flutter
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('assets/FarooqDrive.png', [Convert]::FromBase64String((Get-Content 'assets/FarooqDrive.png.base64' -Raw)))
          magick assets/FarooqDrive.png -define icon:auto-resize=256,128,64,48,32,24,16 windows/runner/resources/app_icon.ico

      - name: Install packages
        working-directory: apps/flutter
        run: flutter pub get

      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze

      - name: Test
        working-directory: apps/flutter
        run: flutter test

      - name: Build Windows test app
        working-directory: apps/flutter
        run: flutter build windows --release --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.FAROOQDRIVE_DESKTOP_CLIENT_ID }}

      - name: Package portable test app
        shell: pwsh
        run: Compress-Archive -Path apps/flutter/build/windows/x64/runner/Release/* -DestinationPath FarooqDrive-Windows-x64-v21.2-Test.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build one-click test installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/flutter/release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=21.2.0" "apps/flutter/installer/FarooqDrive.iss"

      - name: Upload portable test app
        uses: actions/upload-artifact@v4
        with:
          name: FarooqDrive-Windows-x64-v21.2-Test
          path: FarooqDrive-Windows-x64-v21.2-Test.zip
          if-no-files-found: error

      - name: Upload one-click test installer
        uses: actions/upload-artifact@v4
        with:
          name: FarooqDrive-Windows-Installer-v21.2-Test
          path: apps/flutter/release/FarooqDrive-Setup-v21.2.0-Windows-x64.exe
          if-no-files-found: error

      - name: Commit tested source changes to branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/main.dart apps/flutter/lib/models.dart apps/flutter/lib/google_drive_api.dart apps/flutter/lib/drive_controller.dart apps/flutter/pubspec.yaml apps/flutter/pubspec.lock
          git rm .github/patches/file-selection-preview-icons.patch
          git rm .github/workflows/apply-file-preview-test.yml
          git commit -m "Add single-click preview, double-click open and sidebar native icons"
          git push origin HEAD:fix/file-selection-preview-icons
