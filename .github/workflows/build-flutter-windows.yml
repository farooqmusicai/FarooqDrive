name: Build FarooqDrive Flutter Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/build-flutter-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows runner
        working-directory: apps/flutter
        shell: pwsh
        run: |
          flutter create --platforms=windows .
          if (Test-Path test/widget_test.dart) { Remove-Item test/widget_test.dart }
      - name: Restore official app icon
        working-directory: apps/flutter
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('assets/FarooqDrive.png', [Convert]::FromBase64String((Get-Content 'assets/FarooqDrive.png.base64' -Raw)))
          magick assets/FarooqDrive.png -define icon:auto-resize=256,128,64,48,32,24,16 windows/runner/resources/app_icon.ico
      - name: Install packages
        working-directory: apps/flutter
        run: flutter pub get
      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze
      - name: Test
        working-directory: apps/flutter
        run: flutter test
      - name: Build Windows
        working-directory: apps/flutter
        run: flutter build windows --release --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.FAROOQDRIVE_DESKTOP_CLIENT_ID }}
      - name: Package portable app
        shell: pwsh
        run: Compress-Archive -Path apps/flutter/build/windows/x64/runner/Release/* -DestinationPath FarooqDrive-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FarooqDrive-Windows-x64
          path: FarooqDrive-Windows-x64.zip
          if-no-files-found: error
