<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FarooqDrive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" style="padding:32px;font-family:Segoe UI,Arial,sans-serif">
    <h2>FarooqDrive is starting…</h2>
  </div>
  <script>
    window.addEventListener('error', function (event) {
      var el = document.getElementById('app');
      if (el) {
        el.innerHTML = '<div style="max-width:850px;margin:40px auto;padding:24px;background:#fff;border:1px solid #ddd;border-radius:12px">' +
          '<h2 style="color:#b42318">FarooqDrive renderer error</h2>' +
          '<p style="white-space:pre-wrap;word-break:break-word">' + String(event.message || 'Unknown JavaScript error').replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]}) + '</p>' +
          '<p>Please send a screenshot of this exact message. Do not include any OAuth Client Secret or token.</p></div>';
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      var el = document.getElementById('app');
      var msg = event.reason && (event.reason.stack || event.reason.message) || String(event.reason || 'Unknown startup rejection');
      if (el) el.innerHTML = '<div style="max-width:850px;margin:40px auto;padding:24px;background:#fff;border:1px solid #ddd;border-radius:12px"><h2 style="color:#b42318">FarooqDrive startup error</h2><p style="white-space:pre-wrap;word-break:break-word"></p><p>Please send a screenshot of this exact message. Do not include any OAuth Client Secret or token.</p></div>', el.querySelector('p').textContent = msg;
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
