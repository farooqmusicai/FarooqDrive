name: farooqdrive
description: FarooqDrive multi-account Google Drive and Microsoft OneDrive file manager.
publish_to: none
version: 21.2.0+23

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  file_picker: ^8.1.7
  file_saver: ^0.2.14
  crypto: ^3.0.6
  ffi: ^2.1.4
  path_provider_platform_interface: ^2.1.2
  path_provider_windows: ^2.3.0
  shared_preferences_platform_interface: ^2.4.1
  shared_preferences_windows: ^2.4.1
  flutter_secure_storage: ^9.2.4
  image: ^4.9.2
  win32: ^5.15.0
  google_sign_in: ^6.2.2
  http: ^1.3.0
  intl: ^0.20.2
  pdfrx: ^2.6.1
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  xml: ^6.5.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
