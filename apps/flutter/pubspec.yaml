name: farooqdrive
description: FarooqDrive multi-account Google Drive file manager.
publish_to: none
version: 20.0.0+20

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  file_saver: ^0.2.14
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  flutter_file_info: ^0.3.0
  google_sign_in: ^6.2.2
  http: ^1.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
  display_name: FarooqDrive
  publisher_display_name: Mohammad Farooq
  identity_name: MohammadFarooq.FarooqDrive
  publisher: CN=88632D82-E648-416A-A69B-DD8EADB81121
  msix_version: 20.0.0.0
  logo_path: assets/FarooqDrive.png
  architecture: x64
  capabilities: internetClient
  store: true
